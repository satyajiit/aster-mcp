name: Android check

# Compile the companion and run its unit tests on every push that touches it.
# The release workflow runs the same tests, but only when a release is cut —
# which is how a commit that had never compiled sat on main until release day.
on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'apps/android/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug
