name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    # The site quotes tool names, counts and versions straight out of these
    # trees, and docs/scripts/verify-facts.ts fails the build when they drift —
    # so a change to the product has to be able to trigger a docs rebuild.
    paths:
      - docs/**
      - .github/workflows/deploy-docs.yml
      - mcp/package.json
      - mcp/src/mcp/tools.ts
      - apps/android/app/build.gradle.kts
      - apps/android/app/src/main/java/com/aster/service/handlers/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: docs

      - name: Generate static site
        run: pnpm nuxt generate
        working-directory: docs
        env:
          GITHUB_PAGES: 'true'
          # actions/checkout gives us mcp/ and apps/android/, so every source
          # probe in docs/scripts/verify-facts.ts must resolve. Strict mode turns
          # a skipped check into a build failure, so the gate cannot quietly
          # degrade to verifying nothing.
          ASTER_STRICT_FACTS: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
